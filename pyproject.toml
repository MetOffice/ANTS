# Some of the contents of this file have been modified using Met Office Github Copilot Enterprise
# Override default exlude pattern for black.
# By default black will exlude files with "build" in the filepath, but ants is installed
# to $CYLC_WORKFLOW_RUN_DIR/share/fcm_make_ants/build and we want these files to be checked.
[tool.black]
exclude = ".git"

[build-system]
# Minimum requirements for the build system to execute, defined by PEP 518.
requires = ["setuptools>=80", "setuptools-scm[simple]>=8"]

# Defined by PEP 517.
build-backend = 'setuptools.build_meta'

# Configure isort.
[tool.isort]
profile = "black"  # Black compatibility for isort.
# By default isort will exclude "build", so override default.
skip = ".git"

# Configure pytest.
[tool.pytest.ini_options]
addopts = "--durations=5"
filterwarnings = [
    # During unittesting only, treat all warnings as errors by default:
    'error',

    # Ignore warning raised when ANTS is not installed into an environment
    'ignore:No package metadata was found for ANTS. ANTS version set to .*. Consider installing ANTS into your environment. See the installation instructions in the documentation for more details.:UserWarning',

    # And some specific cases where we ignore warnings.
    # TODO: https://github.com/MetOffice/ANTS/issues/67 fix netCDF saving to work with future dask versions
    'ignore:The \`numpy.can_cast\` function is not implemented by Dask array:FutureWarning:dask',

    # Warning for behaviours internal to mule
    'ignore:Ancillary files do not define the UM version number in the Fixed Length Header:UserWarning:mule',

    # Warning for output was conversion to zonal mean.
    'ignore:Output converted to zonal mean.',

    # Warning for tests for now deprecated functionality, see #34:
    'ignore:ants.utils.cube.concatenate and ants.utils.cube.concatenate_cube are deprecated:FutureWarning',

    # Warning for the optional dependency of mule not being present:
    "ignore:Unable to import mule:UserWarning",

    # Warning for the optional dependency of um_spiral_search (from shumlib) not being present:
    "ignore:No module named 'um_spiral_search':UserWarning",

    # Warning for shapely's vectorized.contains being used internally by ants.analysis._merge
    "ignore:The 'shapely.vectorized.contains' function is deprecated and will be removed a future version. Use 'shapely.contains_xy' instead \\(available since shapely 2.0.0\\).:DeprecationWarning:ants.analysis._merge",

    # Warning for numpy.in1d being used internally by ants.utils.ndarray
    'ignore:\`in1d\` is deprecated. Use \`np.isin\` instead.:DeprecationWarning:ants.utils.ndarray',

    # Warning raised by Python itself when forking a multi-threaded process, seen in decomposition tests
    'ignore:This process \(pid=.*\) is multi-threaded, use of fork\(\) may lead to deadlocks in the child.:DeprecationWarning:multiprocessing.popen_fork',

    # Warning for behaviour internal to iris when handling legacy date precision
    'ignore:You are using legacy date precision for Iris units:FutureWarning:iris.common.mixin',

    # Warning for behaviour internal to iris/cf_units when summarising long time interval coordinates
    "ignore:This method is no longer needed due to cftime's improved handling of long time intervals.:DeprecationWarning:iris.coords",

    # Warning for behaviour internal to iris when saving LAM grids to PP format
    "ignore:Saving a cube defined on a Limited Area Model \\(LAM\\) grid to PP format will set the 'pole longitude' field:FutureWarning:iris.fileformats.pp_save_rules",

    "ignore:Saving to netcdf with legacy-style attribute handling for backwards compatibility."

    # Additional filters are defined in ./lib/ants/tests/conftest.py, including:
    # 1. Warning when catopy downloads and caches Natural Earth data.

]

[tool.setuptools.packages.find]
where = ["lib", "bin"]

[tool.setuptools]
script-files = ["bin/ants-launch", "bin/ants-version"]

[project]
name = "ants"
dynamic = ["version"]
authors = [{name = "Model Inputs And Outputs team, Met Office", email = "miao@metoffice.gov.uk"}]
description = "Toolkit for generating ancillary files"
readme = "README.rst"
license = {file ="LICENSE.txt"}
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
    "License :: OSI Approved :: BSD License",
]

[project.scripts]
"ancil_2anc.py" = "ants.cli.ancil_2anc:cli_interface"
"ancil_create_shapefile.py" = "ants.cli.ancil_create_shapefile:cli_interface"
"ancil_fill_n_merge.py" = "ants.cli.ancil_fill_n_merge:cli_interface"
"ancil_general_regrid.py" = "ants.cli.ancil_general_regrid:cli_interface"
"ancil_vertical_regrid.py" = "ants.cli.ancil_vertical_regrid:cli_interface"
